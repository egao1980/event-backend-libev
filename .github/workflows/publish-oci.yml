name: Publish OCI Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (input, else v* tag, else .asd :version)"
        required: false
        default: ""
      registry:
        description: "OCI registry"
        required: false
        default: "ghcr.io"

env:
  LIBEV_VERSION_DEFAULT: "4.33"
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: arm64
            runner: macos-latest

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl autotools-dev automake libtool pkg-config

      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: install
          system: event-backend-libev
      - name: ASDF registry for grovel
        shell: bash
        run: |
          echo "CL_SOURCE_REGISTRY=$(pwd)//:$(pwd)/${CL_REPOSITORY_CLIENT_DIR}//:$HOME/.local/share/cl-repository/systems//:" >> "$GITHUB_ENV"

      - name: Build libev + stage grovel
        env:
          LIBEV_VERSION: ${{ env.LIBEV_VERSION_DEFAULT }}
        run: |
          chmod +x scripts/build-libev.sh scripts/stage-grovel.sh
          ./scripts/build-libev.sh
          export HOMEBREW_PREFIX="${HOMEBREW_PREFIX:-/opt/homebrew}"
          ./scripts/stage-grovel.sh event-backend-libev
          mkdir -p native-bundle/lib native-bundle/grovel
          cp -a "lib/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/lib/
          cp -a "grovel/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/grovel/

      - name: Upload native+grovel artifact
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: native-bundle/

  publish:
    needs: build
    permissions:
      contents: read
      packages: write
    uses: egao1980/cl-repository/.github/workflows/publish-native-package.yml@main
    with:
      package-name: event-backend-libev
      # Empty: the v* tag, else the .asd :version (resolved by the reusable workflow).
      version: ${{ inputs.version }}
      registry: ${{ inputs.registry || 'ghcr.io' }}
      source-paths: |
        event-backend-libev.asd
        src
        LICENSE
        README.md
    secrets: inherit
